name: Тесты

# Зелёный значок на главной странице репозитория — это то, что жюри
# видит до того, как откроет хоть один файл кода.
#
# Тесты запускаются по файлам, а не одной командой. Причина конкретная:
# логи прогонов закрыты для тех, у кого нет доступа к репозиторию, а имена
# и статусы шагов видны всем. Пока workflow падал одной строкой «Тесты»,
# понять, что именно сломалось, было нельзя — и он был красным с первого
# дня, никем не разобранный.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,service]"

      - name: Версии окружения
        run: |
          python -V
          pip list | head -40

      - name: Линтер
        run: ruff check src tests

      - name: "тест test_act.py"
        if: always()
        run: pytest tests/test_act.py -q
      - name: "тест test_aoi.py"
        if: always()
        run: pytest tests/test_aoi.py -q
